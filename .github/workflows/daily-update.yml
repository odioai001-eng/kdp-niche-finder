name: daily-suggest-update

on:
  schedule:
    - cron: '0 21 * * *' # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-suggest.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suggest.json
          git diff --cached --quiet || (git commit -m "chore: 検索サジェストランキングを自動更新" && git push)
